name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libgtk-4-dev libwebkitgtk-6.0-dev libsqlite3-dev
      - name: Verify vendored JS++
        run: make vendor-integrity
      - name: Build and test
        run: make test
      - name: Sanitizers
        run: make test-sanitize
      - name: Verify version command
        run: test "$(./build/vant --version)" = "Vantage Browser 0.1.7"
