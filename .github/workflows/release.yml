name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to release'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  source-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in v*) ;; *) echo "release tag must start with v" >&2; exit 1;; esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          source_version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' src/version.h)
          test -n "$source_version"
          test "$RELEASE_TAG" = "v${source_version}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libgtk-4-dev libwebkitgtk-6.0-dev libsqlite3-dev
      - name: Verify release candidate
        run: |
          make vendor-integrity
          make test
          make test-sanitize
          test "$(./build/vant --version)" = "Vantage Browser ${RELEASE_TAG#v}"
      - name: Build immutable source artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          git archive --format=tar --prefix="vant-${version}/" HEAD | gzip -n > vant-source.tar.gz
          printf '%s\n' "$RELEASE_TAG" > version.txt
          sha256sum vant-source.tar.gz version.txt > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          vant-source.tar.gz version.txt checksums.txt
          --verify-tag --generate-notes
          --title "Vantage Browser $RELEASE_TAG"
